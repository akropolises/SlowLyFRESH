<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>受信トレイ</title>
    <link rel="stylesheet" href="../common/task-base.css">
    <link rel="stylesheet" href="inbox.css">
  </head>
  <body>
    <div class="inbox">
      <nav class="folders">
        <button class="compose" type="button">新規作成</button>
        <a class="folder active">受信トレイ <span class="badge" id="unreadBadge">0</span></a>
        <a class="folder">承認待ち <span class="badge sub" id="approvalBadge">0</span></a>
        <a class="folder">下書き</a>
        <a class="folder">送信済み</a>
        <a class="folder">アーカイブ</a>
      </nav>
      <main class="list-pane">
        <header class="list-header">
          <strong>受信トレイ</strong>
          <span class="list-meta" id="listMeta"></span>
        </header>
        <ul class="mail-list" id="mailList"></ul>
      </main>
    </div>

    <script src="../common/phrases.js"></script>
    <script src="../common/task-kit.js"></script>
    <script src="inbox.js"></script>
  </body>
</html>
