<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>ゆっくリフレッシュ 体験</title>
    <link rel="stylesheet" href="shell.css">
  </head>
  <body>
    <!-- 開始画面 -->
    <section class="launcher" id="launcher">
      <div class="launcher-inner">
        <p class="launcher-title">Slowness for Fastitarian</p>
        <button class="start-button" id="startButton" type="button">はじめる</button>
      </div>
    </section>

    <!-- スタッフが作業を切り替えたときだけ、画面の隅に一瞬出る -->
    <p class="staff-note" id="staffNote"></p>
    <!-- スタッフ設定パネル。開始画面で Ctrl+Alt+Shift+P を押したときだけ出る -->
    <section class="settings hidden" id="settingsPanel">
      <form class="settings-card" id="settingsForm">
        <h2>スタッフ設定</h2>
        <p class="settings-group">共通</p>
        <label class="setting">
          <span class="setting-name">ゆっくリフレッシュの開始</span>
          <input type="range" name="minLeadSeconds">
          <output id="minLeadOutput"></output>
        </label>
        <label class="setting">
          <span class="setting-name">次の回の作業</span>
          <select name="work" id="workSelect"></select>
        </label>
        <p class="settings-group">実際のアプリ(展示用Gmail)</p>
        <label class="setting">
          <span class="setting-name">最初の未読メール</span>
          <input type="range" name="gmailInitialCount">
          <output id="gmailInitialCountOutput"></output>
        </label>
        <label class="setting">
          <span class="setting-name">体験中に届くメール</span>
          <input type="range" name="gmailMailsPerMinute">
          <output id="gmailMailsPerMinuteOutput"></output>
        </label>
        <p class="settings-group">受信トレイ(黒子の作業)</p>
        <label class="setting">
          <span class="setting-name">最初の未読メール</span>
          <input type="range" name="inboxInitialCount">
          <output id="inboxInitialCountOutput"></output>
        </label>
        <label class="setting">
          <span class="setting-name">体験中に届くメール</span>
          <input type="range" name="inboxMailsPerMinute">
          <output id="inboxMailsPerMinuteOutput"></output>
        </label>
        <p class="settings-note">保存した値は、起動し直しても残ります。体験の途中で変えたときは、次の回から使われます。</p>
        <div class="settings-buttons">
          <button type="button" id="settingsReset">初期値に戻す</button>
          <span class="settings-spacer"></span>
          <button type="button" id="settingsCancel">閉じる</button>
          <button type="submit" class="primary">保存して閉じる</button>
        </div>
      </form>
    </section>

    <!-- 展示用Gmailが使えないときだけ、開始画面の隅に出る(スタッフ向け) -->
    <p class="mail-note hidden" id="mailNote"></p>

    <!-- 体験中の小さな表示。体験者は実際のアプリで作業し、展示の画面は画面の左下にこれだけを残す -->
    <section class="widget hidden" id="widget">
      <div class="widget-pill">
        <span class="widget-text" id="widgetText"></span>
        <button class="widget-button" id="widgetButton" type="button">作業を閉じて向かう</button>
      </div>
    </section>

    <!-- 黒子の作業(受信トレイなど)の回の作業画面 -->
    <section class="desktop hidden" id="desktop">
      <div class="work-window" id="workWindow">
        <div class="window-bar">
          <span class="window-title" id="windowTitle"></span>
          <span class="window-controls"><span>─</span><span>□</span><button class="window-close" id="workClose" type="button" aria-label="閉じる">×</button></span>
        </div>
        <p class="work-hint"><span class="demo-tag">デモ用の作業</span><span id="workHint"></span></p>
        <iframe class="task-frame" id="taskFrame" title="作業"></iframe>
        <div class="status-bar">
          <span class="next-event" id="nextEvent"></span>
        </div>
      </div>

      <div class="toasts" id="toasts"></div>

      <!-- ゆっくリフレッシュから戻ったあとに届く、次の予定のリマインド -->
      <div class="meeting-reminder hidden" id="meetingReminder">
        <strong id="meetingReminderText"></strong>
        <button class="meeting-reminder-button" id="meetingReminderButton" type="button">作業を閉じて向かう</button>
      </div>

    </section>

    <!-- 体験の終わり -->
    <section class="end-card hidden" id="endCard">
      <h2 id="endCardTitle"></h2>
      <p>体験はここまでです。ありがとうございました</p>
    </section>

    <script src="../config.js"></script>
    <script src="../tasks/registry.js"></script>
    <script src="../tasks/common/phrases.js"></script>
    <script src="shell.js"></script>
  </body>
</html>
